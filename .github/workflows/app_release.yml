name: "App release"
on:
  release:
    types:
      - released
permissions:
  contents: read
jobs:
  app-release:
    uses: FLECS-Technologies/app-sdk/.github/workflows/app_release.yml@main
    secrets: inherit
    with:
      release-tag: ${{ github.event.release.tag_name }}
      app-version: ${{ github.event.release.tag_name }}
  margo-push:
    uses: ./.github/workflows/margo_push.yml
    secrets: inherit
    with:
      sw-edge-version: ${{ github.event.release.tag_name }}
      bart-version: "latest"
